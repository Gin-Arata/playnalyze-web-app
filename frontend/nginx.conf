# Simpan file ini sebagai: frontend/nginx.conf

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve file statis React/Vite, fallback ke index.html untuk client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy semua request /api/* ke backend FastAPI
    # Sesuaikan "backend" dengan nama service di docker-compose.yml
    # Sesuaikan "/api/" dengan prefix endpoint yang dipakai di kode frontend Anda
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout lebih panjang karena proses analisis sentimen + ringkasan BART bisa lama
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Kompresi supaya loading lebih cepat
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
